---
- name: Prepare Misskey Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Misskey Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Misskey Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
        state: present

    - name: Ensure Docker is installed for Misskey Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker

    - name: Ensure the Misskey additional volume path exists
      ansible.builtin.file:
        path: "{{ misskey_molecule_extra_volume_host_path }}"
        state: directory
        mode: "0755"

    # Read back from inside the running container by verify.yml. Nothing but
    # `misskey_container_additional_volumes_custom` can put it there.
    - name: Ensure the Misskey additional volume carries its marker
      ansible.builtin.copy:
        content: "{{ misskey_molecule_extra_volume_marker }}"
        dest: "{{ misskey_molecule_extra_volume_host_path }}/marker.txt"
        mode: "0644"
