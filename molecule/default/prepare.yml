---
- name: Prepare Misskey Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for Misskey Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for Misskey Molecule tests preparation
      ansible.builtin.package:
        name:
          # The Misskey image is around 4.5 GB across 35 layers. The `vfs` storage
          # driver that the rest of this fleet's scenarios ask for copies the whole
          # filesystem for every layer, which turns that into 41 GB of unpacked data -
          # measured, not estimated - and no CI runner has that. Docker picks
          # fuse-overlayfs when overlay2 cannot mount (it cannot: the inner
          # /var/lib/docker sits on the platform container's own overlayfs) and when the
          # binary exists, and needs about 3.3 GB for the same image. Installing it
          # before Docker starts is what makes the choice available.
          - fuse-overlayfs
          - python3-requests
        state: present

    - name: Ensure Docker is installed for Misskey Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          storage-driver: fuse-overlayfs

    - name: Ensure the Misskey additional volume path exists
      ansible.builtin.file:
        path: "{{ misskey_molecule_extra_volume_host_path }}"
        state: directory
        mode: "0755"

    # Read back from inside the running container by verify.yml. Nothing but
    # `misskey_container_additional_volumes_custom` can put it there.
    - name: Ensure the Misskey additional volume carries its marker
      ansible.builtin.copy:
        content: "{{ misskey_molecule_extra_volume_marker }}"
        dest: "{{ misskey_molecule_extra_volume_host_path }}/marker.txt"
        mode: "0644"
